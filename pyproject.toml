[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mfaesindy"
version = "0.1.0"
description = "Multi-fidelity autoencoder SINDy package built with PyTorch and PySINDy."
readme = "readme.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
  { name = "Filippo Zacchei" }
]
dependencies = [
  "numpy>=1.26,<2",
  "pydantic>=2.6",
  "pysindy>=1.7",
  "pyyaml>=6.0",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = [
  "black>=24.0",
  "mypy>=1.8",
  "pytest>=8.0",
  "ruff>=0.3",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
