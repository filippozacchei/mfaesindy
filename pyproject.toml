[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mf-lnode"
version = "0.1.0"
description = "Multi-fidelity latent Neural ODE reduced-order modeling from offline trajectory data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "torch>=2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "tensorboard>=2.16",
  "torchdiffeq>=0.2.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
